services:
  app:
    tty: true # Keep the container running
    restart: always
    image: ticket-booking
    container_name: ticket-booking
    build: .
    ports:
      - 3000:3000
    env_file:
      - .env
    networks:
      - application
    depends_on:
      db:
        condition: service_healthy
    working_dir: /src/app
    volumes:
      - .:/src/app
    command: air -c .air.toml


  db:
    image: postgres:alpine
    container_name: db
    environment:
      - POSTGRES_HOST=${DB_HOST}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres-db:/var/lib/postgresql/data
    networks:
      - application 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  application:

volumes: 
  postgres-db: